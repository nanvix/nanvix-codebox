name: CI

on:
  schedule:
    - cron: "0 */2 * * *"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install

      - name: Run unit tests
        run: npm test

  smoke:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Download Nanvix sandbox binaries
        run: npm run setup

      - name: Run smoke example
        run: npx nanvix-codebox "What OS are you running on?"
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}

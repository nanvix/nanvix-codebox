name: CI

on:
  schedule:
    - cron: "0 */2 * * *"
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Enable KVM
        if: runner.os == 'Linux'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Validate WHP availability
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          if ((Get-CimInstance Win32_ComputerSystem).HypervisorPresent) {
            Write-Host "Hypervisor already present"
          } else {
            Write-Error "No hypervisor is present and Windows Hypervisor Platform cannot be reliably enabled within this GitHub Actions job. Use a runner with virtualization enabled."
            exit 1
          }

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install

      - name: Run unit tests
        run: npm test

      - name: Download Nanvix sandbox binaries
        run: npm run setup

      - name: Run smoke example
        run: npx nanvix-codebox "What OS are you running on?"

  # Gate job that requires all matrix combinations to pass
  ci:
    if: always()
    needs: [build-and-test]
    runs-on: ubuntu-latest
    steps:
      - name: Check results
        run: |
          if [[ "${{ needs.build-and-test.result }}" != "success" ]]; then
            echo "One or more jobs failed:"
            echo "  build-and-test: ${{ needs.build-and-test.result }}"
            exit 1
          fi

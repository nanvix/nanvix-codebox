name: CI

on:
  schedule:
    - cron: "0 */2 * * *"
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install

      - name: Run unit tests
        run: npm test

  smoke:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Enable KVM
        if: runner.os == 'Linux'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Enable WHP
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          if ((Get-CimInstance Win32_ComputerSystem).HypervisorPresent) {
            Write-Host "Hypervisor already present"
          } else {
            Enable-WindowsOptionalFeature -Online -FeatureName HypervisorPlatform -All -NoRestart
          }

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Download Nanvix sandbox binaries
        run: npm run setup

      - name: Run smoke example
        run: npx nanvix-codebox "What OS are you running on?"
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}

  # Gate job that requires all matrix combinations to pass
  ci:
    if: always()
    needs: [test, smoke]
    runs-on: ubuntu-latest
    steps:
      - name: Check results
        run: |
          if [[ "${{ needs.test.result }}" != "success" || "${{ needs.smoke.result }}" != "success" ]]; then
            echo "One or more jobs failed:"
            echo "  test:  ${{ needs.test.result }}"
            echo "  smoke: ${{ needs.smoke.result }}"
            exit 1
          fi
